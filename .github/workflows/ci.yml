name: workspace-ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run container integration tests
        type: boolean
        default: false
      e2e:
        description: Run browser end-to-end tests
        type: boolean
        default: false
      image:
        description: Build production image and verify Node/Chromium artifacts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.1'
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run test scripts/check-deployment.test.ts
      - run: bun --no-env-file run deployment:check

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run format:check
      - run: bun --no-env-file run lint
      - run: bun --no-env-file run typecheck
      - run: bun --no-env-file run test
      - run: bun --no-env-file run build

  integration:
    if: github.event_name != 'workflow_dispatch' || inputs.integration || inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run infra:up postgres clickhouse nats s3 --wait
      - run: bun --no-env-file run migrate
      - run: node node_modules/playwright/cli.js install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.data/playwright
      - run: bun --no-env-file run test:integration

  e2e:
    if: github.event_name != 'workflow_dispatch' || inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun --no-env-file install --frozen-lockfile
      - run: node node_modules/playwright/cli.js install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.data/playwright
      - run: bun --no-env-file run infra:up postgres clickhouse nats s3 --wait
      - run: bun --no-env-file run build
      - run: bun --no-env-file run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  image:
    if: github.event_name == 'workflow_dispatch' && inputs.image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile -t ais-platform:ci .
      - run: docker run --rm ais-platform:ci node --input-type=module -e "const c=await import('./packages/contracts/dist/index.mjs');if(!c.RawEnvelopeSchema)throw new Error('Missing build artifact');console.log(process.versions.node)"
      - run: docker run --rm ais-platform:ci node --input-type=module -e "import {chromium} from 'playwright';const b=await chromium.launch({headless:true});await b.close();console.log('Chromium launches as runtime user')"
