name: ais-platform-production
x-app: &app
  image: ${AIS_IMAGE:?Set a built and reviewed AIS_IMAGE}
  build:
    context: ..
    dockerfile: infra/Dockerfile
  restart: unless-stopped
  init: true
  stop_grace_period: 120s
  networks: [backend, outbound]
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: ${DATABASE_URL:?Set production DATABASE_URL with URL-encoded credentials}
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_USER: ais
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
    CLICKHOUSE_DATABASE: ais
    NATS_URL: nats://nats:4222
    NATS_TOKEN: ${NATS_AUTH_TOKEN:?Set NATS_AUTH_TOKEN}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_REGION: ${S3_REGION:?Set S3_REGION}
    S3_BUCKET: ${S3_BUCKET:?Set external S3_BUCKET}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    METRICS_HOST: 0.0.0.0
  depends_on:
    init:
      condition: service_completed_successfully
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ais
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ais
    networks: [backend]
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ais -d ais']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 8g
    cpus: 4
    restart: unless-stopped
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: ais
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ais
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    networks: [backend]
    volumes: ['clickhouse-data:/var/lib/clickhouse']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping']
      interval: 5s
      timeout: 3s
      retries: 30
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    mem_limit: 24g
    cpus: 6
    restart: unless-stopped
  nats:
    image: nats:2.11-alpine
    command: ['-c', '/etc/nats/nats.conf']
    environment:
      NATS_AUTH_TOKEN: ${NATS_AUTH_TOKEN:?Set NATS_AUTH_TOKEN}
    networks: [backend]
    volumes: ['nats-data:/data', './nats.production.conf:/etc/nats/nats.conf:ro']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8222/healthz?js-enabled-only=true']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped
  init:
    <<: *app
    restart: 'no'
    command: ['node', 'dist/init.mjs']
    environment:
      <<: *app-env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      nats: { condition: service_healthy }
    mem_limit: 512m
    cpus: 1
  api:
    <<: *app
    command: ['node', 'apps/api/dist/main.mjs']
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: '13000'
      METRICS_PORT: '13100'
      WEB_ORIGINS: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
      TRUSTED_PROXY_CIDRS: ${CADDY_BACKEND_IP:-172.29.40.10}
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      AGENT_MAX_MODEL_CALLS: ${AGENT_MAX_MODEL_CALLS:-12}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-24}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:13100/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    cpus: 2
  agent:
    <<: *app
    profiles: [agent]
    command: ['node', 'apps/agent/dist/main.mjs']
    environment:
      <<: *app-env
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      AGENT_MAX_MODEL_CALLS: ${AGENT_MAX_MODEL_CALLS:-12}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-24}
      AGENT_MAX_RECORDS: ${AGENT_MAX_RECORDS:-50000}
      INTERNAL_METRICS_PORT: '13109'
    mem_limit: 2g
    cpus: 2
  processor:
    <<: *app
    command: ['node', 'apps/processor/dist/main.mjs']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:13101/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 4g
    cpus: 2
  postgres-writer:
    <<: *app
    command: ['node', 'apps/writer/dist/main.mjs']
    environment: { <<: *app-env, WRITER_TARGET: postgres }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:13102/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    cpus: 1
  clickhouse-writer:
    <<: *app
    command: ['node', 'apps/writer/dist/main.mjs']
    environment: { <<: *app-env, WRITER_TARGET: clickhouse }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:13103/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    cpus: 1
  archiver:
    <<: *app
    command: ['node', 'apps/archiver/dist/main.mjs']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:13104/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    cpus: 1
  collector:
    <<: *app
    command: ['node', 'apps/collector/dist/main.mjs']
    environment:
      <<: *app-env
      AIS_ALLOW_LIVE: ${AIS_ALLOW_LIVE:-false}
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      MARINETRAFFIC_API_KEY: ${MARINETRAFFIC_API_KEY:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:13105/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    cpus: 1
  crawler:
    <<: *app
    command: ['node', 'apps/crawler/dist/main.mjs']
    volumes: ['crawler-state:/app/.data/crawlee']
    environment:
      <<: *app-env
      AIS_ALLOW_LIVE: ${AIS_ALLOW_LIVE:-false}
      CRAWL_RUN_TIMEOUT_SECONDS: ${CRAWL_RUN_TIMEOUT_SECONDS:-900}
      MARINETRAFFIC_API_KEY: ${MARINETRAFFIC_API_KEY:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:13106/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    shm_size: 512m
    mem_limit: 2g
    cpus: 1
  intelligence:
    <<: *app
    command: ['node', 'apps/intelligence/dist/main.mjs']
    environment: { <<: *app-env, INTERNAL_METRICS_PORT: '13107' }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:13107/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1
  topic-port-restriction:
    <<: *app
    command: ['node', 'apps/topics/dist/main.mjs']
    environment:
      { <<: *app-env, TOPIC_DEFINITION_ID: port-restriction, INTERNAL_METRICS_PORT: '13108' }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:13108/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    cpus: 1
  topic-low-speed:
    <<: *app
    command: ['node', 'apps/topics/dist/main.mjs']
    environment:
      { <<: *app-env, TOPIC_DEFINITION_ID: area-low-speed-notice, INTERNAL_METRICS_PORT: '13109' }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:13109/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    cpus: 1
  web:
    <<: *app
    command: ['node', 'apps/web/.output/server/index.mjs']
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: '13001'
      NUXT_API_TARGET: http://api:13000
      NUXT_PUBLIC_MAP_TILER_KEY: ${NUXT_PUBLIC_MAP_TILER_KEY:-}
      NUXT_PUBLIC_MAP_STYLE_URL: ${NUXT_PUBLIC_MAP_STYLE_URL:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:13001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1
  caddy:
    image: caddy:2.10-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
    ports: ['80:80', '443:443', '443:443/udp']
    networks:
      backend:
        ipv4_address: ${CADDY_BACKEND_IP:-172.29.40.10}
      outbound: {}
    volumes:
      ['./Caddyfile.production:/etc/caddy/Caddyfile:ro', 'caddy-data:/data', 'caddy-config:/config']
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 1
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    networks: [backend]
    volumes:
      [
        './prometheus.production.yaml:/etc/prometheus/prometheus.yml:ro',
        './alerts.yaml:/etc/prometheus/alerts.yaml:ro',
        'prometheus-data:/prometheus',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9090/-/ready']
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    networks: [backend]
    volumes: ['grafana-data:/var/lib/grafana', './grafana:/etc/grafana/provisioning:ro']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${AIS_BACKEND_SUBNET:-172.29.40.0/24}
  outbound:
volumes:
  postgres-data:
  clickhouse-data:
  nats-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  crawler-state:
