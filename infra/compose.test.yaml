name: ais-fusion-test
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ais
      POSTGRES_PASSWORD: ais-local-only
      POSTGRES_DB: ais
    ports: ['127.0.0.1:15433:5432']
    volumes: ['postgres-test:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ais -d ais']
      interval: 2s
      timeout: 3s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: ais
      CLICKHOUSE_PASSWORD: ais-local-only
      CLICKHOUSE_DB: ais
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports: ['127.0.0.1:18124:8123']
    volumes: ['clickhouse-test:/var/lib/clickhouse']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 2g
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
  nats:
    image: nats:2.11-alpine
    command: ['-c', '/etc/nats/nats.conf']
    ports: ['127.0.0.1:14223:4222']
    volumes: ['nats-test:/data', './nats.conf:/etc/nats/nats.conf:ro']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8222/healthz?js-enabled-only=true']
      interval: 2s
      timeout: 3s
      retries: 30
  s3:
    image: chrislusf/seaweedfs:4.00
    command:
      [
        'server',
        '-s3',
        '-s3.port=8333',
        '-dir=/data',
        '-ip=s3',
        '-volume.max=32',
        '-master.volumeSizeLimitMB=128',
        '-s3.config=/etc/seaweedfs/s3.json',
      ]
    ports: ['127.0.0.1:19001:8333']
    volumes: ['s3-test:/data', './s3.json:/etc/seaweedfs/s3.json:ro']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -qO- http://127.0.0.1:8333/status >/dev/null',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-test:
  clickhouse-test:
  nats-test:
  s3-test:
