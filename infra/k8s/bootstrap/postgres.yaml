apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ais-platform
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ais-platform
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels:
    app.kubernetes.io/name: postgres-headless
    app.kubernetes.io/part-of: ais-platform
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ais-platform
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ais-platform
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: ais-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: ais-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
        - name: postgres
          image: postgis/postgis:17-3.5
          ports:
            - name: service
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: ais
            - name: POSTGRES_DB
              value: ais
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ais-databases
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: '4'
              memory: 8Gi
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - ais
                - -d
                - ais
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - ais
                - -d
                - ais
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
