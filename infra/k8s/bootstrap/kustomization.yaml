apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ais-platform
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - clickhouse.yaml
  - nats.yaml
  - network-policies.yaml
configMapGenerator:
  - name: ais-nats
    files:
      - nats.conf
generatorOptions:
  disableNameSuffixHash: true
