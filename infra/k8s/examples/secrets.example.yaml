apiVersion: v1
kind: Secret
metadata:
  name: ais-databases
  namespace: ais-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-with-postgres-password
  CLICKHOUSE_PASSWORD: replace-with-clickhouse-password
  NATS_AUTH_TOKEN: replace-with-nats-token
---
apiVersion: v1
kind: Secret
metadata:
  name: ais-runtime
  namespace: ais-platform
type: Opaque
stringData:
  DATABASE_URL: postgresql://ais:replace-with-postgres-password@postgres:5432/ais
  CLICKHOUSE_PASSWORD: replace-with-clickhouse-password
  NATS_TOKEN: replace-with-nats-token
  S3_ACCESS_KEY_ID: replace-with-runtime-access-key
  S3_SECRET_ACCESS_KEY: replace-with-runtime-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: ais-bootstrap
  namespace: ais-platform
type: Opaque
stringData:
  ADMIN_USERNAME: replace-with-admin-name
  ADMIN_PASSWORD: replace-with-at-least-12-characters
  S3_ACCESS_KEY_ID: replace-with-bootstrap-access-key
  S3_SECRET_ACCESS_KEY: replace-with-bootstrap-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: ais-sources
  namespace: ais-platform
type: Opaque
stringData:
  AISSTREAM_API_KEY: ''
  MARINETRAFFIC_API_KEY: ''
---
apiVersion: v1
kind: Secret
metadata:
  name: ais-agent
  namespace: ais-platform
type: Opaque
stringData:
  DEEPSEEK_API_KEY: replace-with-deepseek-key
---
apiVersion: v1
kind: Secret
metadata:
  name: ais-monitoring
  namespace: ais-platform
type: Opaque
stringData:
  GF_SECURITY_ADMIN_PASSWORD: replace-with-grafana-password
