apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - agent.yaml
patches:
  - target:
      kind: Deployment
      name: api
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: AGENT_ENABLED
                    value: "true"
                  - name: AGENT_UI_ENABLED
                    value: "true"
