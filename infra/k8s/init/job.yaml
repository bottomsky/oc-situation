apiVersion: batch/v1
kind: Job
metadata:
  name: ais-init
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: init
        app.kubernetes.io/part-of: ais-platform
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
        - name: init
          image: ais-platform:deployment
          command:
            - node
            - dist/init.mjs
          envFrom:
            - configMapRef:
                name: ais-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ais-runtime
                  key: DATABASE_URL
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ais-runtime
                  key: CLICKHOUSE_PASSWORD
            - name: NATS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ais-runtime
                  key: NATS_TOKEN
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ais-bootstrap
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ais-bootstrap
                  key: S3_SECRET_ACCESS_KEY
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ais-bootstrap
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ais-bootstrap
                  key: ADMIN_PASSWORD
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
