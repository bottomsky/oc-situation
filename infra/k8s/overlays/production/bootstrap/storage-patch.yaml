apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # Omitted storageClassName uses the cluster default; set before first apply.
        # storageClassName: production-block
        resources:
          requests:
            storage: 100Gi
