apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ais-gateway-ingress
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: replace-with-ingress-namespace
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 13100
