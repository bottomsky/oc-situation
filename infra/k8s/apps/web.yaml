apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: ais-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/part-of: ais-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: ais-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
        - name: web
          image: ais-platform:deployment
          command:
            - node
            - apps/web/.output/server/index.mjs
          envFrom: []
          env:
            - name: NODE_ENV
              value: production
            - name: NITRO_HOST
              value: 0.0.0.0
            - name: NITRO_PORT
              value: '13001'
          ports:
            - name: http
              containerPort: 13001
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: 13001
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 13001
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 13001
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: ais-platform
spec:
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: ais-platform
  ports:
    - name: http
      port: 13001
      targetPort: http
