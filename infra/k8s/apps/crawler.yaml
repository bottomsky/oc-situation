apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler
  labels:
    app.kubernetes.io/name: crawler
    app.kubernetes.io/part-of: ais-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: crawler
      app.kubernetes.io/part-of: ais-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crawler
        app.kubernetes.io/part-of: ais-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
        - name: crawler
          image: ais-platform:deployment
          command:
            - node
            - apps/crawler/dist/main.mjs
          envFrom:
            - configMapRef:
                name: ais-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ais-runtime
                  key: DATABASE_URL
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ais-runtime
                  key: CLICKHOUSE_PASSWORD
            - name: NATS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ais-runtime
                  key: NATS_TOKEN
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ais-runtime
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ais-runtime
                  key: S3_SECRET_ACCESS_KEY
            - name: MARINETRAFFIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ais-sources
                  key: MARINETRAFFIC_API_KEY
            - name: METRICS_PORT
              value: '13106'
          ports:
            - name: metrics
              containerPort: 13106
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /metrics
              port: 13106
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 13106
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 13106
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          volumeMounts:
            - name: crawler-state
              mountPath: /app/.data/crawlee
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      securityContext:
        fsGroup: 1000
      volumes:
        - name: crawler-state
          persistentVolumeClaim:
            claimName: crawler-state
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: crawler
  labels:
    app.kubernetes.io/name: crawler
    app.kubernetes.io/part-of: ais-platform
spec:
  selector:
    app.kubernetes.io/name: crawler
    app.kubernetes.io/part-of: ais-platform
  ports:
    - name: metrics
      port: 13106
      targetPort: metrics
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crawler-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
