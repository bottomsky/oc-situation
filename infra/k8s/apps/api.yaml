apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ais-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: ais-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: ais-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
        - name: api
          image: ais-platform:deployment
          command:
            - node
            - apps/api/dist/main.mjs
          envFrom: &a1
            - configMapRef:
                name: ais-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ais-runtime
                  key: DATABASE_URL
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ais-runtime
                  key: CLICKHOUSE_PASSWORD
            - name: NATS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ais-runtime
                  key: NATS_TOKEN
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ais-runtime
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ais-runtime
                  key: S3_SECRET_ACCESS_KEY
            - name: API_HOST
              value: 127.0.0.1
            - name: API_PORT
              value: '13000'
            - name: METRICS_PORT
              value: '13100'
            - name: TRUSTED_PROXY_CIDRS
              value: 127.0.0.1/32,::1/128
          ports:
            - name: metrics
              containerPort: 13100
          securityContext: &a2
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /metrics
              port: 13100
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 13100
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 13100
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
        - name: gateway
          image: caddy:2.10-alpine
          ports:
            - name: http
              containerPort: 8080
          envFrom: *a1
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy
              readOnly: true
            - name: caddy-data
              mountPath: /data
            - name: caddy-runtime
              mountPath: /config
          securityContext: *a2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: '1'
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
      securityContext:
        fsGroup: 1000
      volumes:
        - name: caddy-config
          configMap:
            name: ais-caddy
        - name: caddy-data
          emptyDir: {}
        - name: caddy-runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: ais-platform
spec:
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ais-platform
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: api-metrics
  labels:
    app.kubernetes.io/name: api-metrics
    app.kubernetes.io/part-of: ais-platform
spec:
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ais-platform
  ports:
    - name: metrics
      port: 13100
      targetPort: metrics
