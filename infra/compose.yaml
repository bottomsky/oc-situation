name: ais-platform
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ais
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ais-local-only}
      POSTGRES_DB: ais
    ports: ['127.0.0.1:15432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ais -d ais']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: ais
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ais-local-only}
      CLICKHOUSE_DB: ais
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports: ['127.0.0.1:18123:8123']
    volumes: ['clickhouse-data:/var/lib/clickhouse']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 3g
    cpus: 3
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    restart: unless-stopped
  nats:
    image: nats:2.11-alpine
    command: ['-c', '/etc/nats/nats.conf']
    ports: ['127.0.0.1:14222:4222', '127.0.0.1:18222:8222']
    volumes: ['nats-data:/data', './nats.conf:/etc/nats/nats.conf:ro']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8222/healthz?js-enabled-only=true']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
  s3:
    image: chrislusf/seaweedfs:4.00
    command:
      [
        'server',
        '-s3',
        '-s3.port=8333',
        '-dir=/data',
        '-ip=s3',
        '-volume.max=32',
        '-master.volumeSizeLimitMB=128',
        '-s3.config=/etc/seaweedfs/s3.json',
      ]
    ports: ['127.0.0.1:19000:8333']
    volumes: ['s3-data:/data', './s3.json:/etc/seaweedfs/s3.json:ro']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
  caddy:
    image: caddy:2.10-alpine
    ports: ['127.0.0.1:18080:80']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy-data:/data', 'caddy-config:/config']
    extra_hosts: ['host.docker.internal:host-gateway']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=15d']
    ports: ['127.0.0.1:19090:9090']
    volumes:
      [
        './prometheus.yaml:/etc/prometheus/prometheus.yml:ro',
        './alerts.yaml:/etc/prometheus/alerts.yaml:ro',
        'prometheus-data:/prometheus',
      ]
    extra_hosts: ['host.docker.internal:host-gateway']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-ais-local-only}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ['127.0.0.1:13003:3000']
    volumes: ['grafana-data:/var/lib/grafana', './grafana:/etc/grafana/provisioning:ro']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: 1
    restart: unless-stopped
volumes:
  postgres-data:
  clickhouse-data:
  nats-data:
  s3-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
